var lang='en';
function applyLang(l){
  lang = T[l]?l:'en';
  document.documentElement.lang = lang;
  var d = T[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var v=d[el.getAttribute('data-i18n')]; if(v!=null) el.innerHTML=v;
  });
  document.querySelectorAll('.langbtn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')===lang); });
  // pre-filled email template for the "Let's talk" button
  var mb = document.getElementById('mail-btn');
  if(mb) mb.setAttribute('href', 'mailto:zhukavetst@gmail.com?subject=' + encodeURIComponent(d.mail_subj) + '&body=' + encodeURIComponent(d.mail_body));
  try{ localStorage.setItem('cv-lang', lang); }catch(e){}
}
document.querySelectorAll('.langbtn').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); }); });

var themeBtn=document.getElementById('theme-btn');
function applyTheme(t){
  var on=t==='light'; document.body.classList.toggle('light',on);
  themeBtn.textContent=on?'🌙':'☀'; themeBtn.title=on?'Dark theme':'Light theme';
  try{ localStorage.setItem('cv-theme',t); }catch(e){}
}
themeBtn.addEventListener('click', function(){ applyTheme(document.body.classList.contains('light')?'dark':'light'); });

<script>
/* ✦ Static golden starry sky — drawn once, no animation (dark theme only) */
(function(){
  var c = document.getElementById('starfield'); if(!c) return;
  var ctx = c.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0;
  function draw(){
    W = window.innerWidth; H = window.innerHeight;
    c.width = W*DPR; c.height = H*DPR; c.style.width = W+'px'; c.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    var n = Math.round(W*H/2500);
    for(var i=0;i<n;i++){
      var x = Math.random()*W, y = Math.random()*H, t = Math.random();
      var rad = t<0.80 ? Math.random()*0.7+0.35 : (t<0.96 ? Math.random()*0.6+0.9 : Math.random()*0.7+1.5);
      var op  = t<0.80 ? Math.random()*0.30+0.12 : (t<0.96 ? Math.random()*0.30+0.38 : Math.random()*0.25+0.6);
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832);
      ctx.fillStyle = (Math.random()<0.14) ? 'rgba(255,245,220,'+op+')' : 'rgba(244,200,108,'+op+')';
      ctx.fill();
    }
  }
  draw(); window.addEventListener('resize', draw);
})();
</script>
